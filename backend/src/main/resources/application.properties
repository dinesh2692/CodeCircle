spring.application.name=codecircle
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codecircle}
spring.datasource.username=${DATABASE_USER:codecircle}
spring.datasource.password=${DATABASE_PASSWORD:codecircle}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}
