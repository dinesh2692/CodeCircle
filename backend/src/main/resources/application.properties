spring.application.name=codecircle
server.port=${PORT:8080}

# PostgreSQL is used when DATABASE_URL is provided; H2 keeps local/demo startup simple.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/codecircle;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-12345678901234567890}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}
