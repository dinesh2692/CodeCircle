services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codecircle
      POSTGRES_USER: codecircle
      POSTGRES_PASSWORD: codecircle
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codecircle
      DATABASE_USER: codecircle
      DATABASE_PASSWORD: codecircle
      JWT_SECRET: replace-this-with-a-random-secret-at-least-32-characters-long
    depends_on:
      - postgres
volumes:
  pgdata:
