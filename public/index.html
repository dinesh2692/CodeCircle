<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeCircle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font:14px Arial}button,input,textarea{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#334155}input{width:100%;padding:11px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#fff}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}.card{width:min(430px,92%);background:#111827;border:1px solid #334155;border-radius:16px;padding:24px}.card h1{margin-top:0}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.app{display:grid;grid-template-columns:220px 1fr 310px;height:100vh}.side{background:#111827;padding:16px;border-right:1px solid #263244}.right{border-left:1px solid #263244;border-right:0}.main{min-width:0;display:flex;flex-direction:column}.top{height:58px;padding:12px 16px;border-bottom:1px solid #263244;display:flex;align-items:center;gap:12px}.spacer{flex:1}.editor{flex:1;display:flex}.lines{width:48px;padding:14px 8px;text-align:right;color:#64748b;background:#0e1526;white-space:pre;font:14px Consolas}.code{flex:1;border:0;resize:none;background:#0b1020;color:#e2e8f0;padding:14px;font:14px Consolas;outline:0}.console{height:170px;border-top:1px solid #263244;background:#080d18;padding:12px;white-space:pre-wrap;overflow:auto}.section{margin-bottom:20px}.label{font-size:11px;text-transform:uppercase;color:#94a3b8;margin:10px 0}.row{display:flex;gap:8px}.users{padding:0;list-style:none}.users li{padding:8px 0;border-bottom:1px solid #1f2937}.messages{height:270px;overflow:auto}.msg{padding:7px 0;border-bottom:1px solid #1f2937}.msg b{color:#93c5fd}.small{font-size:12px;color:#94a3b8}.status{padding:6px 10px;border-radius:20px;background:#172033}.online{color:#86efac}@media(max-width:900px){.app{grid-template-columns:180px 1fr}.right{display:none}}@media(max-width:650px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body>
<div id="auth" class="modal"><div class="card"><h1>⚡ CodeCircle</h1><p class="small">Collaborative coding with live rooms and voice chat.</p><div class="tabs"><button id="loginTab">Login</button><button id="registerTab" class="secondary">Create account</button></div><input id="email" type="email" placeholder="Email address"><div style="height:10px"></div><input id="password" type="password" placeholder="Password (8+ characters)"><div style="height:12px"></div><button id="authBtn" style="width:100%">Login</button><p id="authMsg" class="small"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>⚡ CodeCircle</h2><div id="account" class="small"></div><div class="section"><div class="label">Room</div><button id="createRoom" style="width:100%">＋ Create Room</button><div style="height:8px"></div><div class="row"><input id="room" maxlength="6" placeholder="ABC123"><button id="joinRoom">Join</button></div></div><div class="section"><div class="label">Code</div><button id="compile" style="width:100%;background:#15803d">▶ Compile</button></div><button id="logout" class="secondary" style="width:100%">Logout</button></aside><main class="main"><div class="top"><b id="roomTitle">No room</b><span id="status" class="status">Disconnected</span><span class="spacer"></span><span id="sync" class="small">Ready</span></div><div class="editor"><div id="lines" class="lines">1</div><textarea id="code" class="code" spellcheck="false">import java.util.*;

public class Main {
    public static void main(String[] args) {
        System.out.println("Hello CodeCircle!");
    }
}</textarea></div><div id="console" class="console">Compiler ready. Create or join a room.</div></main><aside class="side right"><div class="label">Participants</div><ul id="users" class="users"></ul><div class="label">Voice Chat</div><div class="row"><button id="voice">🎙 Start Voice</button><button id="mute" class="secondary" disabled>Mute</button></div><p id="voiceState" class="small">Voice is off</p><div class="label">Chat</div><div id="messages" class="messages"></div><div class="row"><input id="chat" placeholder="Message..."><button id="send">Send</button></div></aside></div>
<script>
const $=id=>document.getElementById(id);let mode='login',token=localStorage.getItem('cc_token'),ws=null,room='',myId='',users=new Map(),peers=new Map(),localStream=null,timer;
function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};return fetch(path,opts)}
function authMode(m){mode=m;$('loginTab').className=m==='login'?'':'secondary';$('registerTab').className=m==='register'?'':'secondary';$('authBtn').textContent=m==='login'?'Login':'Create account';$('authMsg').textContent=''}
$('loginTab').onclick=()=>authMode('login');$('registerTab').onclick=()=>authMode('register');
$('authBtn').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8)return $('authMsg').textContent='Enter a valid email and password of at least 8 characters.';let r=await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify({email,password})}),x=await r.json();if(!r.ok)return $('authMsg').textContent=x.message||'Authentication failed';token=x.token;localStorage.setItem('cc_token',token);showApp(email)};
function showApp(email){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('account').textContent=email}
$('logout').onclick=()=>{if(ws)ws.close();localStorage.removeItem('cc_token');location.reload()};
async function createRoom(){let r=await api('/api/rooms',{method:'POST'});if(!r.ok){$('console').textContent='Unable to create room. Please login again.';return}let x=await r.json();$('room').value=x.room;connect(x.room)}
$('createRoom').onclick=createRoom;$('joinRoom').onclick=()=>connect($('room').value);
function connect(r){r=r.toUpperCase().replace(/[^A-Z0-9]/g,'');if(r.length!==6)return alert('Room code must be 6 characters.');room=r;if(ws)ws.close();let base=(location.protocol==='https:'?'wss://':'ws://')+location.host;ws=new WebSocket(base+'/ws?token='+encodeURIComponent(token)+'&room='+encodeURIComponent(room)+'&name='+encodeURIComponent($('account').textContent));ws.onopen=()=>{$('status').textContent='● Connected';$('status').className='status online';$('roomTitle').textContent='Room '+room};ws.onclose=()=>{$('status').textContent='Disconnected';$('status').className='status'};ws.onerror=()=>{$('status').textContent='Connection error'};ws.onmessage=e=>handle(JSON.parse(e.data))}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function handle(m){if(m.type==='user-joined'){users.set(m.id,m.name);renderUsers();addMsg('System',m.name+' joined')}else if(m.type==='user-left'){let n=users.get(m.id)||'User';users.delete(m.id);let p=peers.get(m.id);if(p)p.close();peers.delete(m.id);renderUsers();addMsg('System',n+' left')}else if(m.type==='chat')addMsg(m.name,m.text);else if(m.type==='code'){$('code').value=m.text;$('sync').textContent='Synced';updateLines()}else if(m.type==='signal')signal(m);}
function renderUsers(){let u=$('users');u.innerHTML='';users.forEach((n,id)=>{let li=document.createElement('li');li.textContent=n+(id===myId?' (you)':'');u.append(li)})}function addMsg(n,t){let d=document.createElement('div');d.className='msg';let b=document.createElement('b');b.textContent=n+': ';d.append(b,document.createTextNode(t));$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}
$('code').oninput=()=>{updateLines();$('sync').textContent='Syncing...';clearTimeout(timer);timer=setTimeout(()=>{send({type:'code',text:$('code').value});$('sync').textContent='Live'},150)};function updateLines(){$('lines').textContent=Array.from({length:$('code').value.split('\n').length},(_,i)=>i+1).join('\n')}updateLines();
$('compile').onclick=async()=>{let r=await api('/api/compiler/compile',{method:'POST',body:JSON.stringify({code:$('code').value})}),x=await r.json();$('console').textContent=x.message||x.output||x.error||JSON.stringify(x)};
$('send').onclick=()=>{let t=$('chat').value.trim();if(t){send({type:'chat',text:t});$('chat').value=''}};$('chat').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
async function startVoice(){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});$('voice').textContent='🔴 Voice Active';$('mute').disabled=false;$('voiceState').textContent='Microphone active';for(const id of users.keys())if(id!==myId)makePeer(id,true)}catch(e){$('voiceState').textContent='Microphone permission denied'}}
function makePeer(id,offer){if(peers.has(id))return peers.get(id);let p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(id,p);if(localStream)localStream.getTracks().forEach(t=>p.addTrack(t,localStream));p.onicecandidate=e=>{if(e.candidate)send({type:'signal',to:id,data:{candidate:e.candidate}})};p.ontrack=e=>{let a=document.getElementById('audio-'+id);if(!a){a=document.createElement('audio');a.id='audio-'+id;a.autoplay=true;document.body.append(a)}a.srcObject=e.streams[0]};if(offer)p.createOffer().then(o=>p.setLocalDescription(o)).then(()=>send({type:'signal',to:id,data:{offer:p.localDescription}}));return p}
async function signal(m){let p=makePeer(m.from,false),d=m.data;if(d.offer){await p.setRemoteDescription(d.offer);let a=await p.createAnswer();await p.setLocalDescription(a);send({type:'signal',to:m.from,data:{answer:p.localDescription}})}else if(d.answer)await p.setRemoteDescription(d.answer);else if(d.candidate)try{await p.addIceCandidate(d.candidate)}catch(e){}}
$('voice').onclick=startVoice;$('mute').onclick=()=>{if(localStream){let t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;$('mute').textContent=t.enabled?'Mute':'Unmute'}};
if(token){api('/api/projects').then(r=>{if(r.status===401){localStorage.removeItem('cc_token');token=null;return}showApp('Signed in')}).catch(()=>{})}
</script></body></html>
